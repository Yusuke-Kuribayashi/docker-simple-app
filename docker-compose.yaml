services:
  api:
    container_name: api
    build: ./api
    ports:
      - 8080:8080
    tty: true
    volumes:
      # apiディレクトリをコンテナ内のworkspaceディレクトリに入れる
      # cachedはオプション
      - ./api:/workspace:cached 

  web:
    # --name
    container_name: web
    # --build
    build: ./web
    # --ports
    ports:
      - 3000:3000
    environment:
      - REACT_APP_API_SERVER=http://localhost:8080/api
    # -t
    tty: true
    volumes:
      - ./web:/workspace:cached
    depends_on:
      - api
